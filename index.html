<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SETHEON｜沙暴王座</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:#080604;color:#f8d77b;font-family:"Noto Sans TC",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#71341455,transparent 35%),linear-gradient(#0d0805cc,#050403ee),repeating-linear-gradient(90deg,#0000 0 7px,#e6a23b08 8px 9px);pointer-events:none}
.app{width:min(1120px,100%);margin:auto;padding:18px 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-family:Cinzel,serif;font-size:clamp(26px,5vw,48px);font-weight:900;letter-spacing:5px;color:#ffd866;text-shadow:0 3px 0 #381708,0 0 24px #e88a1e}
.tag{font-size:12px;letter-spacing:2px;color:#d6a95d}
.frame{position:relative;border:3px solid #b8781c;border-radius:22px;padding:12px;background:linear-gradient(135deg,#1d1009,#6a2b0d 50%,#1b0d07);box-shadow:0 0 0 2px #3c1b0b,0 18px 55px #000}
.frame:before{content:"𓂀";position:absolute;left:50%;top:-31px;transform:translateX(-50%);font-size:38px;color:#ffd15a;text-shadow:0 0 18px #ff9c21;z-index:3}
.hero{display:grid;grid-template-columns:180px 1fr 180px;gap:10px;align-items:stretch}
.side{border:2px solid #9e5e17;border-radius:14px;background:linear-gradient(#1a0c07,#090504);padding:10px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.god{font-size:80px;filter:drop-shadow(0 0 15px #f5a42b);margin-bottom:5px}.side b{font-family:Cinzel,serif;color:#ffd75f;font-size:20px}.side small{color:#b9894b}
.machine{border:3px solid #d69a2b;border-radius:16px;padding:9px;background:#090604;box-shadow:inset 0 0 30px #d07a1625}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{height:clamp(100px,17vw,145px);border-radius:10px;border:2px solid #c48725;background:linear-gradient(180deg,#f6d987,#b87320 50%,#54200c);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 18px #fff4b055,0 3px 9px #000}
.cell:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff8 0 7%,transparent 18% 75%,#0003);pointer-events:none}
.icon{font-size:clamp(40px,7vw,67px);filter:drop-shadow(0 4px 2px #3c1508);z-index:1}
.spinning .icon{animation:blur .09s linear infinite}@keyframes blur{50%{transform:translateY(16px);filter:blur(2px)}}
.win{animation:win .6s ease 3;box-shadow:0 0 30px #ffd34d,inset 0 0 30px #fff}
@keyframes win{50%{transform:scale(1.045);filter:brightness(1.4)}}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.stat{background:#100805;border:1px solid #7f4814;border-radius:9px;padding:8px;text-align:center}.stat span{display:block;font-size:11px;color:#aa7b42}.stat strong{font-size:21px;color:#ffe69b}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
button{font:900 15px "Noto Sans TC";border:1px solid #dba13a;color:#2a1205;background:linear-gradient(#ffe79a,#d58920);border-radius:10px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #67300e}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}
.spin{font-family:Cinzel,serif;font-size:23px;letter-spacing:3px;padding:14px 42px;border-radius:50px;background:radial-gradient(circle at 35% 25%,#fff2a8,#e99a25 45%,#8d3e0c);box-shadow:0 0 18px #e78b22,0 5px 0 #5d2509}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{border:1px solid #754314;background:#100806;border-radius:10px;padding:10px;color:#cda360;font-size:13px}
.card h3{margin:0 0 6px;color:#ffd967;font-family:Cinzel,serif}
.message{text-align:center;min-height:25px;margin:8px;color:#ffd966;font-weight:900}
@media(max-width:780px){.hero{grid-template-columns:1fr}.side{display:none}.bottom{grid-template-columns:1fr}.frame{padding:8px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">SETHEON</div><div class="tag">THRONE OF THE STORM · 原創埃及戰神主題</div></div><div>𓂀 𓆣 𓂀</div></div>
  <div class="frame">
    <div class="hero">
      <div class="side"><div class="god">🐺</div><b>風暴之王</b><small>SETHEON</small></div>
      <div class="machine">
        <div class="reels" id="reels"></div>
        <div class="stats">
          <div class="stat"><span>餘額</span><strong id="balance">10,000</strong></div>
          <div class="stat"><span>下注</span><strong id="bet">100</strong></div>
          <div class="stat"><span>本局獎金</span><strong id="win">0</strong></div>
        </div>
        <div class="controls">
          <button onclick="bet(-50)">− BET</button>
          <button class="spin" id="spin" onclick="spin()">SPIN</button>
          <button onclick="bet(50)">BET ＋</button>
        </div>
        <div class="message" id="msg">風暴尚未甦醒……</div>
      </div>
      <div class="side"><div class="god">👁️</div><b>神眼寶庫</b><small>SCATTER ×3</small></div>
    </div>
    <div class="bottom">
      <div class="card"><h3>𓆣 PAYTABLE</h3>🐺 ×3：下注 ×15　 👑 ×3：×10　 ☀️ ×3：×7<br>🔱 ×3：×5　 🦂 ×3：×4　 🪙 ×3：×2</div>
      <div class="card"><h3>⚡ BONUS SYSTEM</h3>🟣 Wild 可替代一般圖標　｜　👁️ Scatter 3 個觸發免費遊戲<br>免費遊戲中下注鎖定，倍率球會累積到總獎金。</div>
    </div>
  </div>
</div>
<script>
const icons=["🐺","👑","☀️","🔱","🦂","🪙","🟣","👁️"];
const mult={"🐺":15,"👑":10,"☀️":7,"🔱":5,"🦂":4,"🪙":2};
let balance=10000, betValue=100, busy=false;
const reels=document.getElementById("reels");
for(let i=0;i<15;i++){let c=document.createElement("div");c.className="cell";c.innerHTML='<div class="icon">☀️</div>';reels.appendChild(c)}
const cells=[...document.querySelectorAll(".cell")], sleep=m=>new Promise(r=>setTimeout(r,m));
function draw(){document.getElementById("balance").textContent=balance.toLocaleString();document.getElementById("bet").textContent=betValue.toLocaleString()}
function bet(n){if(!busy){betValue=Math.max(50,Math.min(1000,betValue+n));draw()}}
function pick(){return icons[Math.floor(Math.random()*icons.length)]}
async function spin(){
 if(busy||balance<betValue)return;
 busy=true;document.getElementById("spin").disabled=true;balance-=betValue;document.getElementById("win").textContent=0;draw();
 cells.forEach(c=>c.classList.add("spinning"));
 for(let col=0;col<5;col++){
   let end=Date.now()+650+col*150;
   while(Date.now()<end){for(let r=0;r<3;r++)cells[col+r*5].querySelector(".icon").textContent=pick();await sleep(55)}
   for(let r=0;r<3;r++){cells[col+r*5].querySelector(".icon").textContent=pick();cells[col+r*5].classList.remove("spinning")}
 }
 let result=cells.map(c=>c.querySelector(".icon").textContent), counts={};
 result.forEach(x=>counts[x]=(counts[x]||0)+1);
 let best=0, sym="";
 for(const x of Object.keys(mult))if((counts[x]||0)>=3&&mult[x]>best){best=mult[x];sym=x}
 let scatter=(counts["👁️"]||0);
 let prize=best?betValue*best:0;
 if(scatter>=3){prize+=betValue*5;document.getElementById("msg").textContent="👁️ 神眼開啟！BONUS +"+betValue*5+"！"}
 else if(prize)document.getElementById("msg").textContent="⚡ "+sym+" 連線！獎金 "+prize.toLocaleString();
 else document.getElementById("msg").textContent="沙暴席捲而過……下一局，讓王座屬於你。";
 if(prize){balance+=prize;cells.forEach(c=>{if(c.querySelector(".icon").textContent===sym)c.classList.add("win")});setTimeout(()=>cells.forEach(c=>c.classList.remove("win")),1900)}
 document.getElementById("win").textContent=prize.toLocaleString();draw();busy=false;document.getElementById("spin").disabled=false;
}
draw();
</script>
</body>
</html>
