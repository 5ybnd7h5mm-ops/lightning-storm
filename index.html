<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SETHEON｜Storm Throne</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070403;color:#f6d77d;font-family:Arial,"Noto Sans TC",sans-serif}
body{display:flex;justify-content:center;padding:12px;background:radial-gradient(ellipse at 50% 18%,#8a350f 0,#321109 35%,#070403 76%)}
button{font:900 15px Arial,"Noto Sans TC";cursor:pointer}
.app{width:min(1100px,100%)}
.header{display:flex;justify-content:space-between;align-items:end;margin:4px 4px 12px}
.logo{font-size:clamp(30px,6vw,58px);font-weight:1000;letter-spacing:7px;color:#ffd45b;text-shadow:0 4px #351207,0 0 24px #ff8b1a}
.kicker{font-size:11px;letter-spacing:3px;color:#b98a4d}
.frame{position:relative;border:3px solid #d29129;border-radius:24px;padding:12px;background:linear-gradient(135deg,#211008,#67250b 48%,#180a06);box-shadow:0 0 0 3px #3b1709,0 20px 60px #000}
.stage{display:grid;grid-template-columns:145px 1fr 145px;gap:10px}
.altar{border:2px solid #925318;border-radius:16px;background:linear-gradient(#1b0b06,#080403);display:flex;align-items:center;justify-content:center;text-align:center;min-height:520px}
.figure{font-size:90px;filter:drop-shadow(0 0 20px #ff9c23)}.altar b{display:block;color:#ffd65d;font-size:18px}.altar small{color:#a97942}
.machine{border:2px solid #b8711c;border-radius:18px;background:#090504;padding:9px;box-shadow:inset 0 0 35px #d87d1720}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cell{height:clamp(105px,15vw,145px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #d49a32;border-radius:10px;background:linear-gradient(#f5dc91,#b46a1b 48%,#4b190b);box-shadow:inset 0 0 25px #fff4a833,0 3px 8px #000}
.cell:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff9 0 6%,transparent 17% 77%,#0003);pointer-events:none}
.sym{font-size:clamp(38px,6.5vw,64px);position:relative;z-index:2;filter:drop-shadow(0 4px 2px #3a1307)}
.rolling .sym{animation:roll .07s infinite}@keyframes roll{50%{transform:translateY(15px);filter:blur(2px)}}
.cell.hot{animation:hot .55s 3}.cell.winbig{animation:hot .4s 5}
@keyframes hot{50%{transform:scale(1.07);filter:brightness(1.5);box-shadow:0 0 30px #ffd34d,inset 0 0 25px #fff}}
.symbol-name{position:absolute;bottom:4px;font-size:9px;color:#4b1808;font-weight:900;z-index:2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 0}
.stat{background:#120705;border:1px solid #754014;border-radius:9px;text-align:center;padding:7px}.stat span{font-size:10px;color:#9d7040;display:block}.stat strong{font-size:19px;color:#ffe6a1}
.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.ctrl{padding:10px 15px;border:1px solid #d79c34;border-radius:9px;color:#351407;background:linear-gradient(#ffe89d,#d7861d);box-shadow:0 3px #67300d}
.spin{padding:15px 44px;border-radius:40px;border:2px solid #ffd86c;color:#301006;font-size:24px;letter-spacing:3px;background:radial-gradient(circle at 35% 25%,#fff5b6,#efa329 48%,#8d360b);box-shadow:0 0 20px #f08a1d,0 5px #5a2109}
.ctrl:active,.spin:active{transform:translateY(3px);box-shadow:none}.ctrl:disabled,.spin:disabled{opacity:.45;cursor:not-allowed}
.message{height:32px;text-align:center;padding:7px;color:#ffd75c;font-weight:900}
.panel{border:1px solid #704012;background:#100604;border-radius:10px;padding:9px;font-size:12px;color:#c49a5c;line-height:1.8;margin-top:8px}.panel h3{margin:0;color:#ffdc72;font-size:14px}
.balls{display:flex;gap:7px;min-height:34px;align-items:center;flex-wrap:wrap}.ball{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:1000;color:#250c07;background:radial-gradient(circle at 30% 25%,#fff,#d7a7ff 32%,#702da2 70%);box-shadow:0 0 14px #a95be0}.ball.rare{background:radial-gradient(circle at 30% 25%,#fff,#ffd65c 35%,#d13d13 75%);box-shadow:0 0 18px #ff9d27}
.overlay{display:none;position:fixed;inset:0;background:#050302e8;z-index:20;align-items:center;justify-content:center;text-align:center}.overlay.show{display:flex}.bonusbox{width:min(520px,90%);border:3px solid #d99b35;border-radius:20px;padding:25px;background:radial-gradient(circle,#70290c,#180806 70%);box-shadow:0 0 60px #ff8d1c}.bonusbox h2{font-size:42px;color:#ffd85e;margin:5px}.bonusbox p{color:#e9c985}
.multOverlay{display:none;position:fixed;inset:0;z-index:30;pointer-events:none;align-items:center;justify-content:center;background:radial-gradient(circle,#ffb22c22,transparent 45%)}.multOverlay.show{display:flex;animation:flash .9s}.dropBall{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;color:#2a0b05;background:radial-gradient(circle at 30% 22%,#fff,#dcb0ff 25%,#8b3bb4 62%,#3b125c);box-shadow:0 0 35px #bd6aff,0 0 100px #f6b83e;animation:drop 1s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{0%{transform:translateY(-55vh) scale(.35);opacity:0}55%{transform:translateY(25px) scale(1.12);opacity:1}72%{transform:translateY(-12px) scale(.96)}100%{transform:translateY(0) scale(1)}}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.shake{animation:shake .08s 10}@keyframes shake{25%{transform:translate(3px,1px)}50%{transform:translate(-3px,-1px)}75%{transform:translate(2px,-2px)}}
@media(max-width:760px){.stage{grid-template-columns:1fr}.altar{display:none}.stats{grid-template-columns:repeat(2,1fr)}.frame{padding:7px}.cell{height:88px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><div class="logo">SETHEON</div><div class="kicker">STORM THRONE · ORIGINAL EGYPTIAN SLOT</div></div><div>𓆣 𓂀 𓆣</div></div>
<div class="frame" id="frame">
<div class="stage">
<div class="altar"><div><div class="figure">🐺</div><b>風暴王座</b><small>SETHEON</small></div></div>
<div class="machine">
<div class="reels" id="reels"></div>
<div class="stats">
<div class="stat"><span>餘額</span><strong id="balance">10,000</strong></div>
<div class="stat"><span>下注</span><strong id="bet">100</strong></div>
<div class="stat"><span>本局獎金</span><strong id="win">0</strong></div>
<div class="stat"><span>FREE SPINS</span><strong id="fs">0</strong></div>
</div>
<div class="controls">
<button class="ctrl" onclick="changeBet(-50)">− BET</button>
<button class="spin" id="spin" onclick="spin()">SPIN</button>
<button class="ctrl" onclick="changeBet(50)">BET ＋</button>
<button class="ctrl" id="buy" onclick="buyFS()">購買 FREE ×100</button>
</div>
<div class="message" id="msg">風暴正在集結……</div>
<div class="panel"><h3>⚡ 倍率球</h3><div class="balls" id="balls">尚未累積倍率球</div></div>
<div class="panel"><h3>𓂀 PAYTABLE</h3>🐺 ×3 = 15×　👑 ×3 = 10×　☀️ ×3 = 7×　🔱 ×3 = 5×　🦂 ×3 = 4×　🪙 ×3 = 2×<br>🟣 Wild 可替代一般圖標。👁️ Scatter 3+ 觸發免費遊戲。</div>
</div>
<div class="altar"><div><div class="figure">👁️</div><b>神眼寶庫</b><small>SCATTER</small></div></div>
</div>
</div>
</div>

<div class="overlay" id="overlay"><div class="bonusbox"><h2>FREE SPINS</h2><p id="bonusText"></p><button class="spin" onclick="closeBonus()">進入</button></div></div>
<div class="multOverlay" id="multOverlay"><div class="dropBall" id="dropBall">×5</div></div>

<script>
/* ===== 你可以直接在這裡調整機率 ===== */
const CONFIG={
  normalMultiplierChance:0.08, // 一般遊戲：8%
  freeMultiplierChance:0.25,   // FREE SPINS：25%
  buyFreeSpinsCost:100,        // 購買費用 = 下注 × 100
  startingBalance:10000,
  startingBet:100,
  freeSpinsOnTrigger:10
};

/* 倍率球各倍率的相對機率。總和不必一定是100 */
const MULTIPLIER_TABLE=[
  {value:2,weight:50},
  {value:3,weight:25},
  {value:5,weight:15},
  {value:10,weight:7},
  {value:25,weight:3}
];

const SYMBOLS=[
  ["🐺","風暴狼",15],["👑","王冠",10],["☀️","太陽",7],["🔱","神杖",5],
  ["🦂","聖甲蟲",4],["🪙","黃金",2],["🟣","WILD",0],["👁️","SCATTER",0]
];
let balance=CONFIG.startingBalance,betValue=CONFIG.startingBet,freeSpins=0,busy=false,multBalls=[];
const reels=document.getElementById("reels");
for(let i=0;i<15;i++){const c=document.createElement("div");c.className="cell";c.innerHTML='<div class="sym">☀️</div><div class="symbol-name">太陽</div>';reels.appendChild(c)}
const cells=[...document.querySelectorAll(".cell")],wait=ms=>new Promise(r=>setTimeout(r,ms));
function draw(){
 document.getElementById("balance").textContent=balance.toLocaleString();
 document.getElementById("bet").textContent=betValue.toLocaleString();
 document.getElementById("fs").textContent=freeSpins;
 renderBalls();
}
function changeBet(n){if(!busy&&freeSpins===0){betValue=Math.max(50,Math.min(1000,betValue+n));draw()}}
function weightedMultiplier(){
 const total=MULTIPLIER_TABLE.reduce((a,x)=>a+x.weight,0);let r=Math.random()*total;
 for(const x of MULTIPLIER_TABLE){r-=x.weight;if(r<0)return x.value}return 2;
}
function shouldDropMultiplier(){
 const chance=freeSpins>0?CONFIG.freeMultiplierChance:CONFIG.normalMultiplierChance;
 return Math.random()<chance;
}
function renderBalls(){
 const el=document.getElementById("balls");
 if(!multBalls.length){el.textContent="尚未累積倍率球";return}
 el.innerHTML=multBalls.map(x=>`<span class="ball ${x>=10?"rare":""}">×${x}</span>`).join("")+
 ` <b>總倍率 ×${multBalls.reduce((a,b)=>a+b,0)}</b>`;
}
async function animateMultiplierBall(value){
 const ov=document.getElementById("multOverlay"),ball=document.getElementById("dropBall"),frame=document.getElementById("frame");
 ball.textContent="×"+value;ov.classList.add("show");frame.classList.add("shake");
 await wait(1050);ov.classList.remove("show");frame.classList.remove("shake");
 multBalls.push(value);renderBalls();
}
function showBonus(text){document.getElementById("bonusText").textContent=text;document.getElementById("overlay").classList.add("show")}
function closeBonus(){document.getElementById("overlay").classList.remove("show")}
function buyFS(){
 if(busy||freeSpins>0)return;
 const cost=betValue*CONFIG.buyFreeSpinsCost;
 if(balance<cost){document.getElementById("msg").textContent="餘額不足，無法購買 FREE SPINS。";return}
 balance-=cost;freeSpins=CONFIG.freeSpinsOnTrigger;multBalls=[];
 document.getElementById("msg").textContent="𓂀 神眼試煉開啟！";
 draw();showBonus(`購買成功！${freeSpins} 次免費遊戲開始，倍率球機率提升至 ${CONFIG.freeMultiplierChance*100}%。`);
}
function pick(){return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]}

async function spin(){
 if(busy)return;
 if(freeSpins===0&&balance<betValue){document.getElementById("msg").textContent="金幣不足。";return}
 busy=true;document.getElementById("spin").disabled=true;document.getElementById("buy").disabled=true;
 if(freeSpins===0)balance-=betValue;else freeSpins--;
 document.getElementById("win").textContent="0";draw();
 cells.forEach(c=>c.classList.add("rolling"));
 const result=[];
 for(let col=0;col<5;col++){
   const end=Date.now()+480+col*135;
   while(Date.now()<end){
     for(let r=0;r<3;r++){const d=pick();cells[col+r*5].querySelector(".sym").textContent=d[0];cells[col+r*5].querySelector(".symbol-name").textContent=d[1]}
     await wait(45);
   }
   for(let r=0;r<3;r++){const d=pick();result[col+r*5]=d[0];cells[col+r*5].querySelector(".sym").textContent=d[0];cells[col+r*5].querySelector(".symbol-name").textContent=d[1];cells[col+r*5].classList.remove("rolling")}
 }
 let scatter=result.filter(x=>x==="👁️").length,wild=result.filter(x=>x==="🟣").length;
 let counts={};result.forEach(x=>counts[x]=(counts[x]||0)+1);
 let best=0,winner="";
 for(const d of SYMBOLS)if(d[2]&&counts[d[0]]>=3&&d[2]>best){best=d[2];winner=d[0]}
 let prize=best?betValue*best:0;
 if(wild&&best)prize+=betValue*wild;

 /* 倍率球機率：每一次 Spin 各自獨立判斷，不是每押必出 */
 if(shouldDropMultiplier()){
   const value=weightedMultiplier();
   await animateMultiplierBall(value);
   document.getElementById("msg").textContent=`⚡ 倍率球 ×${value} 降臨！`;
   if(freeSpins>0)prize*=multBalls.reduce((a,b)=>a+b,0);
   else prize*=value;
 }
 if(scatter>=3){
   const add=scatter===3?8:scatter===4?12:16;
   freeSpins+=add;
   document.getElementById("msg").textContent=`👁️ 神眼開啟！+${add} FREE SPINS`;
   showBonus(`Scatter ×${scatter}！追加 ${add} 次免費遊戲。`);
 }
 if(prize){
   balance+=prize;document.getElementById("win").textContent=prize.toLocaleString();
   cells.forEach(c=>{if(c.querySelector(".sym").textContent===winner)c.classList.add("hot")});
   setTimeout(()=>cells.forEach(c=>c.classList.remove("hot")),1800);
   if(!scatter)document.getElementById("msg").textContent=`🔥 ${winner} 連線！獎金 ${prize.toLocaleString()}`;
 }else if(!scatter&&freeSpins===0)document.getElementById("msg").textContent="沙暴席捲而過……";
 else if(!scatter)document.getElementById("msg").textContent=`免費遊戲剩 ${freeSpins} 次`;
 if(freeSpins===0)multBalls=[];
 draw();busy=false;document.getElementById("spin").disabled=false;document.getElementById("buy").disabled=false;
}
draw();
</script>
</body>
</html>
